<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Game of Life</title>
	<link href="style.css" rel="stylesheet">
</head>
<body>

<header class="controls">

	<div class="row transport">
		<button id="step"   type="button" title="advance one generation [n]">step</button>
		<button id="play"   type="button" title="run / pause [space]">play</button>
		<button id="reset"  type="button" title="back to your last setup [r]">reset</button>
		<button id="clear"  type="button" title="empty the board [x]">clear</button>
		<button id="random" type="button" title="random soup [?]">random</button>
		<div class="readout"><span>gen</span><b id="gen">00000</b></div>
		<div class="readout"><span>pop</span><b id="pop">0</b></div>
	</div>

	<div class="row settings">

		<label class="field">
			<span>zoom</span>
			<input id="zoom" type="range" min="3" max="40" step="1" value="14">
			<output id="zoom_out">14</output>
		</label>

		<label class="field">
			<span>speed</span>
			<input id="speed" type="range" min="1" max="60" step="1" value="12">
			<output id="speed_out">12/s</output>
		</label>

		<label class="field">
			<span>trail</span>
			<input id="trail" type="range" min="0" max="90" step="5" value="60">
			<output id="trail_out">60%</output>
		</label>

		<label class="field narrow">
			<span>rows</span>
			<input id="rows" type="number" min="3" max="600" step="1">
		</label>

		<label class="field narrow">
			<span>cols</span>
			<input id="cols" type="number" min="3" max="600" step="1">
		</label>

		<label class="field check">
			<input id="fit" type="checkbox" checked>
			<span>fit window</span>
		</label>

		<label class="field check">
			<input id="wrap" type="checkbox" checked>
			<span>wrap edges</span>
		</label>

		<label class="field narrow">
			<span>rule</span>
			<input id="rule" type="text" value="B3/S23" spellcheck="false" autocomplete="off">
		</label>

		<label class="field">
			<span>stamp</span>
			<select id="pattern"></select>
		</label>

		<label class="field">
			<span>palette</span>
			<select id="palette">
				<option value="">classic</option>
				<option value="go">go board</option>
				<option value="chalk">chalkboard</option>
				<option value="paper">paper</option>
				<option value="amber">amber</option>
			</select>
		</label>

	</div>

</header>

<main class="stage">
	<div class="board">
		<!-- two layers: the grid never changes, so it is drawn once and left alone.
		     only the cell layer is cleared and repainted each generation. -->
		<canvas id="grid_layer"></canvas>
		<canvas id="cell_layer"></canvas>
	</div>
</main>

<script src="./game.js"></script>
</body>
</html>
